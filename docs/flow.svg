xt><text x="344" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >kept off-screen</text><path d="M580 115 H612 M604 107 L614 115 L604 123" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="40" width="250" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="650" cy="72" r="17" fill="#7c3aed"/><text x="650" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="676" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" >Summarize video</text><text x="640" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >waits until the answer is</text><text x="640" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >finished (👍👎 row appears)</text><path d="M876 115 H908 M900 107 L910 115 L900 123" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="916" y="40" width="250" height="150" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><circle cx="946" cy="72" r="17" fill="#dc2626"/><text x="946" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="972" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" >Card on the right</text><text x="936" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >copied in, panel closed,</text><text x="936" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >saved for next time</text><text x="600.0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle" >About 6–7 seconds per video · the whole thing runs inside your own YouTube tab</text></svg>